<title>한국어 학교 · Кампус</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: one phone-width column (a school day on a phone): campus scene → timetable → gradebook; lesson view = chalkboard + paper sheets. */
:root{
  --paper:#eceee8; --desk:#d9ddd5; --sheet:#fbfbf8; --line:#cfd4cc;
  --ink:#1d2327; --ink-2:#59646a; --ink-3:#8b9497;
  --board:#2d4b3f; --board-2:#365a4b; --chalk:#f2f0e4; --chalk-2:#c9d3c4;
  --cheong:#2f5f8f; --jeok:#b5412f; --hwang:#c98f17; --baek:#8f8a7a; --heuk:#2a2f33;
  --redpen:#c8322b; --ok:#2f7a4f;
  --sky:#cfe1e7; --sky-2:#e8efe9; --hill:#b5c8bd; --hill-2:#9fb6aa; --ground:#d6d9c6; --path:#e6e3d3;
  --wall:#f7f5ee; --wall-side:#d8d4c7; --win:#b9c9d0; --win-lit:#f1bf45; --roof:#3d4a52; --fog:#e8eee9;
  --ginkgo:#dfae28; --trunk:#6f5b48; --track:#c98a6b;
  --f-ui:"Golos Text","Gowun Dodum",system-ui,sans-serif;
  --f-kr:"Gowun Dodum","Golos Text",sans-serif;
  --f-disp:"Black Han Sans","Golos Text",sans-serif;
  --f-chalk:"Caveat","Nanum Pen Script",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14191c; --desk:#0d1113; --sheet:#1c2226; --line:#2c353a;
  --ink:#e8ebe6; --ink-2:#a4aeb0; --ink-3:#6f7a7d;
  --board:#20372e; --board-2:#2a4639; --chalk:#eeece0; --chalk-2:#a9b8a8;
  --cheong:#6c9bcb; --jeok:#e0735f; --hwang:#e6b443; --baek:#cfc9b6; --heuk:#c3c9cc;
  --redpen:#f0675d; --ok:#5cbf86;
  --sky:#18263a; --sky-2:#22344b; --hill:#1d2d33; --hill-2:#172429; --ground:#1b231f; --path:#262e29;
  --wall:#3a4247; --wall-side:#2b3237; --win:#222b31; --win-lit:#f5c452; --roof:#11161a; --fog:#1a2530;
  --ginkgo:#b68b1f; --trunk:#4c3f33; --track:#7a5444;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#14191c; --desk:#0d1113; --sheet:#1c2226; --line:#2c353a;
  --ink:#e8ebe6; --ink-2:#a4aeb0; --ink-3:#6f7a7d;
  --board:#20372e; --board-2:#2a4639; --chalk:#eeece0; --chalk-2:#a9b8a8;
  --cheong:#6c9bcb; --jeok:#e0735f; --hwang:#e6b443; --baek:#cfc9b6; --heuk:#c3c9cc;
  --redpen:#f0675d; --ok:#5cbf86;
  --sky:#18263a; --sky-2:#22344b; --hill:#1d2d33; --hill-2:#172429; --ground:#1b231f; --path:#262e29;
  --wall:#3a4247; --wall-side:#2b3237; --win:#222b31; --win-lit:#f5c452; --roof:#11161a; --fog:#1a2530;
  --ginkgo:#b68b1f; --trunk:#4c3f33; --track:#7a5444;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kr{font-family:var(--f-kr)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cheong);outline-offset:2px;border-radius:6px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.date{font-family:var(--f-kr);font-size:13px;color:var(--ink-2)}
.date b{color:var(--ink);font-weight:400}
.top-r{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:1.8}
.iconbtn[aria-pressed="false"] svg{opacity:.4}

/* greeting */
.hello{padding-block:4px 10px}
.hello h1{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.1;margin:0;letter-spacing:.5px;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--ink-2);font-size:14px}

/* scene */
.scene-wrap{position:relative;margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.scene{display:block;width:100%;height:auto}
.bld{cursor:pointer}
.bld:focus{outline:none}
.bld:focus-visible .front,.bld.sel .front{stroke:var(--cheong);stroke-width:2}
.bld .lbl{font-family:var(--f-kr);font-size:11px;fill:var(--ink)}
.bld .lbl-bg{fill:var(--sheet);opacity:.92}
.fogged{opacity:.38}
.leaf{fill:var(--ginkgo)}
@media (prefers-reduced-motion: no-preference){
  .leaf{animation:fall 7s linear infinite}
  .win.now{animation:pulse 1.8s ease-in-out infinite}
  .win.fresh{animation:fresh 1.2s ease-out 3}
}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-30px,170px) rotate(320deg);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes fresh{0%{filter:brightness(2)}100%{filter:none}}

.info{margin:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.info .badge{font-family:var(--f-disp);font-size:20px;min-width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--board);color:var(--chalk)}
.info h3{margin:0;font-size:15px}
.info p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.info .grow{flex:1;min-width:0}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--win-lit)}

/* section heads */
.sec{padding-block:22px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:20px;letter-spacing:.5px}
.sec span{font-size:12px;color:var(--ink-3)}

/* timetable */
.tt{list-style:none;margin:0;display:flex;flex-direction:column;gap:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding:0}
.tt li+li{border-top:1px dashed var(--line)}
.slot{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left}
.slot .per{font-family:var(--f-kr);font-size:13px;color:var(--ink-2);line-height:1.15}
.slot .per small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--ink-3)}
.slot .what{min-width:0}
.slot .what b{display:block;font-weight:500;font-size:14.5px}
.slot .what span{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:2px}
.sk{display:inline-block;font-family:var(--f-kr);font-size:11px;padding:1px 7px;border-radius:5px;color:#fff;background:var(--c)}
.sk.light{color:var(--ink);background:transparent;border:1px solid var(--c)}
.slot .st{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot.done .what b{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.slot.next{background:linear-gradient(90deg,color-mix(in srgb,var(--win-lit) 18%,transparent),transparent 70%)}
.slot.next .st{color:var(--ink);font-weight:600}
.go{display:inline-flex;align-items:center;gap:4px;background:var(--board);color:var(--chalk);border-radius:999px;padding:5px 12px;font-size:12.5px}
.tick{color:var(--ok);font-weight:700}

/* gradebook */
.gb{margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.gb-row{display:grid;grid-template-columns:78px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.gb-row .bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.gb-row .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px}
.gb-row .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.gb-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--ink-2)}
.gb-foot b{color:var(--ink)}

/* tab bar */
.tabs{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tab{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3)}
.tab .k{font-family:var(--f-kr);font-size:15px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .k{color:var(--jeok)}
.tab .n{font-size:10px;background:var(--redpen);color:#fff;border-radius:8px;padding:0 5px;margin-left:2px}
.spacer{height:24px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px);text-align:center;z-index:20}

/* ===== lesson ===== */
.lhead{display:flex;align-items:center;gap:10px;padding-block:12px}
.lhead .t{flex:1;min-width:0}
.lhead .t small{display:block;font-size:12px;color:var(--ink-3)}
.lhead .t b{font-weight:600;font-size:15px}
.dots{display:flex;gap:5px;padding-block:0 12px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--board-2)}
.dots i.cur{background:var(--win-lit)}

.board{margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:radial-gradient(120% 90% at 30% 20%,var(--board-2),var(--board));border-radius:16px;border:8px solid var(--trunk);color:var(--chalk);padding:18px 16px 20px;position:relative;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.board::after{content:"";position:absolute;left:18px;right:18px;bottom:-8px;height:6px;background:var(--wall-side);border-radius:0 0 4px 4px}
.board h2{font-family:var(--f-chalk);font-weight:700;font-size:26px;margin:0 0 4px;line-height:1.1;color:var(--chalk)}
.board .sub{font-size:13px;color:var(--chalk-2);margin:0 0 14px}
.chalk{font-family:var(--f-chalk);font-size:22px;line-height:1.3}
.cl{display:block}
@media (prefers-reduced-motion: no-preference){
  .cl{animation:write .7s ease-out both;animation-delay:calc(var(--i,0) * .45s)}
}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.hl-a{color:#9fd0ff}
.hl-b{color:#ffd37a}
.no{color:#ff9c8f}
.yes{color:#a6e3b5}

.sheetbox{margin:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;background-image:repeating-linear-gradient(transparent 0 27px,color-mix(in srgb,var(--cheong) 12%,transparent) 27px 28px)}
.sheetbox h4{margin:0 0 8px;font-size:13px;color:var(--ink-2);font-weight:500}

/* chat (situation) */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-kr);font-size:13px;color:#fff;flex:none}
.bub{background:color-mix(in srgb,var(--chalk) 12%,transparent);border:1px solid color-mix(in srgb,var(--chalk) 25%,transparent);border-radius:14px;padding:8px 12px;max-width:78%;text-align:left;color:var(--chalk)}
.bub .k{font-family:var(--f-kr);font-size:17px;display:block}
.bub .ru{display:block;font-size:12.5px;color:var(--chalk-2);margin-top:3px}
.who{font-size:11px;color:var(--chalk-2);margin-bottom:2px}

/* options */
.q{font-family:var(--f-kr);font-size:19px;margin:4px 0 12px;line-height:1.5}
.q .gap{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-3);text-align:center;color:var(--cheong)}
.q .ru{display:block;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 10px;font-family:var(--f-kr);font-size:18px;text-align:center}
.opt.wide{grid-column:1/-1;font-family:var(--f-ui);font-size:14px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--sheet))}
.opt.wrong{border-color:var(--redpen);text-decoration:line-through;text-decoration-color:var(--redpen);color:var(--ink-3)}
.fb{margin-top:12px;font-size:14px;border-left:3px solid var(--c,var(--ok));padding:4px 0 4px 10px}
.fb.bad{--c:var(--redpen)}
.fb .pen{font-family:var(--f-chalk);font-size:20px;color:var(--c,var(--ok));display:block;line-height:1.1}
.count{font-size:12px;color:var(--ink-3);margin-bottom:6px;font-variant-numeric:tabular-nums}

/* tiles */
.target{min-height:58px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px dashed var(--ink-3);border-radius:12px;margin-bottom:12px;align-items:center}
.target:empty::before{content:"Нажимайте на блоки по порядку";color:var(--ink-3);font-size:13px;padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-kr);font-size:18px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);box-shadow:0 2px 0 var(--line)}
.tile .p{color:var(--jeok)}
.tile .e{color:var(--cheong)}
.tile:active{transform:translateY(1px);box-shadow:none}

/* rule table */
.rtable{width:100%;border-collapse:collapse;font-size:13px;color:var(--chalk)}
.rtable th,.rtable td{padding:6px 4px;border-bottom:1px solid color-mix(in srgb,var(--chalk) 22%,transparent);text-align:left;vertical-align:top}
.rtable th{font-weight:500;color:var(--chalk-2);font-size:12px}
.rtable td.k{font-family:var(--f-kr);font-size:14px}

/* finish */
.stamp{width:150px;height:150px;border-radius:50%;border:5px solid var(--redpen);color:var(--redpen);display:grid;place-items:center;text-align:center;margin:8px auto 14px;transform:rotate(-12deg);font-family:var(--f-disp);font-size:26px;line-height:1.05;position:relative;background:color-mix(in srgb,var(--redpen) 6%,transparent)}
.stamp::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid var(--redpen)}
.stamp small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;margin-top:4px}
@media (prefers-reduced-motion: no-preference){.stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:11.5px;color:var(--ink-2)}

.lfoot{position:sticky;bottom:0;margin-top:auto;background:linear-gradient(transparent,var(--paper) 30%);padding-top:22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
.cta{width:100%;border:0;border-radius:14px;background:var(--board);color:var(--chalk);padding:14px;font-size:16px;font-weight:600}
.cta:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--ink-3);text-align:center;margin:8px 0 0}
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const S={lessonDone:false,errors:4,bell:true,sel:'g2',step:0,stepState:{},lessonErrors:0,fresh:false};

/* ---------- sound: 딩동댕 school chime ---------- */
let ac=null;
function bell(){
  if(!S.bell)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    [784,659,523].forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.32;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.1);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.2);
    });
  }catch(e){}
}
let tT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- campus data ---------- */
const B={
  prep:{name:'예비반',ru:'Подготовительный · Хангыль',st:'Сдано · 출석 18 дней',units:[1,1,1,1],badge:'0급'},
  g1:{name:'1급 교실',ru:'Начальная школа · 1 класс',st:'Выпускной экзамен: 136 / 200',units:Array(10).fill(1),badge:'1급'},
  g2:{name:'2급 교실',ru:'Начальная школа · 2 класс',st:'Юнит 7 «Здоровье» · урок 4 из 10',units:[1,1,1,1,1,1,.5,0,0,0],badge:'2급',cur:true},
  lib:{name:'도서관',ru:'Библиотека · 38 книг подходят вам',st:'Сейчас читаете «비 오는 날», гл. 2',badge:'책'},
  club:{name:'동아리관',ru:'Клубы · 드라마, K-pop',st:'Открыт 드라마 동아리 · 3 сцены',badge:'반'},
  yard:{name:'운동장',ru:'Двор · микро-тренажёры',st:'Числа · 불규칙 · 존댓말 · частицы',badge:'놀'},
  g3:{name:'3급',ru:'Средняя школа',st:'Закрыто · можно сдать экстерном',badge:'3급',locked:true},
  g4:{name:'4급',ru:'Средняя школа',st:'Закрыто',badge:'4급',locked:true},
  g5:{name:'5급',ru:'Старшая школа',st:'Закрыто',badge:'5급',locked:true},
  g6:{name:'6급',ru:'Старшая школа',st:'Закрыто',badge:'6급',locked:true}
};

function bld(id,x,y,w,h,cols,rows,opt={}){
  const d=opt.d||Math.round(w*.18),b=B[id];
  let s=`<g class="bld${opt.fog?' fogged':''}${S.sel===id?' sel':''}" data-id="${id}" tabindex="0" role="button" aria-label="${b.name}, ${b.ru}">`;
  s+=`<polygon points="${x+w},${y} ${x+w+d},${y-d*.55} ${x+w+d},${y+h-d*.55} ${x+w},${y+h}" fill="var(--wall-side)"/>`;
  s+=`<polygon points="${x-3},${y} ${x+w+3},${y} ${x+w+d+2},${y-d*.55} ${x+d-1},${y-d*.55}" fill="var(--roof)"/>`;
  s+=`<rect class="front" x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--wall)"/>`;
  const pw=(w-12)/cols, ph=(h-(opt.door?22:10))/rows;
  let k=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const u=b.units?b.units[k]:(opt.lit&&opt.lit.includes(k)?1:0);
    let cls='win',fill='var(--win)';
    if(u===1){fill='var(--win-lit)'}
    if(u===.5){fill='var(--win-lit)';cls+=S.fresh?' fresh':' now'}

    k++;
  }
  if(opt.door)s+=`<rect x="${x+w/2-8}" y="${y+h-16}" width="16" height="16" fill="var(--roof)"/>`;
  if(opt.clock)s+=`<circle cx="${x+w/2}" cy="${y-12}" r="9" fill="var(--wall)" stroke="var(--roof)" stroke-width="2"/><path d="M${x+w/2} ${y-12}v-5M${x+w/2} ${y-12}h4" stroke="var(--roof)" stroke-width="1.6"/>`;
  if(opt.flag)s+=`<path d="M${x+w+d+10} ${y+h-d*.55}V${y-34}" stroke="var(--ink-2)" stroke-width="1.5"/><path d="M${x+w+d+10} ${y-34}h18l-4 6 4 6h-18z" fill="var(--jeok)"/>`;

  return s+'</g>';
}

    stepPractice();
  }));
  if(answered&&!fin){
    const n=$('#next'),clone=n.cloneNode(true);n.replaceWith(clone);
    clone.addEventListener('click',()=>{st.i++;delete st.ans;stepPractice()});
  }
}

const BUILD={ru:'Урок скоро начнётся, давайте поторопимся.',target:['수업이','곧','시작하니까','서두릅시다'],
  pool:['서두릅시다','시작해서','곧','수업이','시작하니까','수업을'],
  html:{'수업이':'수업<span class="p">이</span>','수업을':'수업<span class="p">을</span>','시작하니까':'시작하<span class="e">니까</span>','시작해서':'시작해<span class="e">서</span>','서두릅시다':'서두릅<span class="e">시다</span>','곧':'곧'}};
function stepBuild(){
  const st=S.stepState;st.ans=st.ans||[];
  const pool=BUILD.pool.filter(w=>!st.ans.includes(w));
  lessonShell(`<section class="board" style="padding-bottom:14px"><h2>Соберите предложение</h2><p class="sub" style="margin:0">Порядок слов в корейском: подлежащее, обстоятельство, сказуемое в конце. Лишние блоки есть.</p></section>
  <div class="sheetbox">
    <p class="q" style="font-family:var(--f-ui);font-size:16px">${BUILD.ru}</p>
    <div class="target" id="target">${st.ans.map(w=>`<button class="tile" data-w="${w}">${BUILD.html[w]}</button>`).join('')}</div>
    <div class="pool">${pool.map(w=>`<button class="tile" data-w="${w}" ${st.ok?'disabled':''}>${BUILD.html[w]}</button>`).join('')}</div>
    <div id="fb">${st.fb||''}</div>
  </div>`,{next:st.ok?'Завершить урок':'Проверить',enabled:st.ok||st.ans.length>0});
  if(!st.ok){
    app.querySelectorAll('.pool .tile').forEach(b=>b.addEventListener('click',()=>{st.ans.push(b.dataset.w);st.fb='';stepBuild()}));
    app.querySelectorAll('#target .tile').forEach(b=>b.addEventListener('click',()=>{st.ans.splice(st.ans.indexOf(b.dataset.w),1);st.fb='';stepBuild()}));
    const n=$('#next'),c=n.cloneNode(true);n.replaceWith(c);
    c.addEventListener('click',()=>{
      const a=st.ans.join(' '),t=BUILD.target.join(' ');
      if(a===t){st.ok=1;st.fb=`<div class="fb"><span class="pen">참 잘했어요!</span><span class="kr">수업이 곧 시작하니까 서두릅시다.</span></div>`}
      else{
        S.lessonErrors++;
        let why='Проверьте порядок: сказуемое всегда в конце.';
        if(st.ans.includes('시작해서'))why='<span class="kr">시작해서</span> не сочетается с <span class="kr">서두릅시다</span>: перед предложением «давайте» нужен <span class="kr">-(으)니까</span>.';
        else if(st.ans.includes('수업을'))why='<span class="kr">수업</span> здесь подлежащее (урок начинается сам), поэтому частица <span class="kr">이/가</span>, а не <span class="kr">을/를</span>.';
        else if(st.ans.length<4)why='Не хватает блоков.';
        st.fb=`<div class="fb bad"><span class="pen">거의 다 왔어요</span>${why}</div>`;
      }
      stepBuild();
    });
  }
}

function stepDone(){
  const score=Math.max(60,100-S.lessonErrors*8);
  lessonShell(`<section class="board" style="text-align:center"><h2>수업 끝!</h2><p class="sub" style="margin:0">Урок окончен. Учитель ставит печать.</p></section>
  <div class="sheetbox" style="background-image:none">
    <div class="stamp">참<br>잘했어요<small>${score} баллов</small></div>
    <div class="sum">
      <div><b>3</b><span>новых карточки<br>в 단어장</span></div>
      <div><b>${S.lessonErrors}</b><span>ошибок<br>в 오답노트</span></div>
      <div><b>+0.1</b><span>к основе<br>어휘·문법</span></div>
    </div>
    <p style="font-size:13px;color:var(--ink-2);margin:14px 0 0">Через 1 день FSRS вернёт <span class="kr">-(으)니까</span> в 조회 с новыми предложениями. Контраст с <span class="kr">-기 때문에</span> будет в уроке 6.</p>
  </div>`,{next:'В кампус · 2교시'});
  bell();
}

/* ---------- routing ---------- */
function route(){
  if(location.hash==='#lesson'){if(S.step===undefined)S.step=0;renderStep()}
  else campus();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
